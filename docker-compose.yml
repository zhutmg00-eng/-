# ============================================================
# 碳资产助手 — Docker Compose（开发环境）
#
# 一键启动：docker compose up -d
# ============================================================

services:
  # ---- FastAPI API服务 ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src  # 开发热重载
    environment:
      - CORS_ORIGINS=http://localhost:8501,http://localhost:3000
      - APP_API_KEY=${APP_API_KEY:-dev-key}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- Streamlit Web UI ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon-web
    command: streamlit run src/ui/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src  # 开发热重载
    environment:
      - API_BASE_URL=http://api:8000
      - APP_API_KEY=${APP_API_KEY:-dev-key}
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
